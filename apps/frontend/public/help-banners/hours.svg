<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Business hours banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="220" cy="160" r="90" fill="#FFFFFF" stroke="#F59E0B" stroke-width="8"/>
  <circle cx="220" cy="160" r="8" fill="#B45309"/>
  <line x1="220" y1="160" x2="220" y2="100" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="160" x2="270" y2="180" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <rect x="380" y="60" width="720" height="200" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="420" y="105" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Business hours</text>
  <rect x="420" y="130" width="200" height="36" rx="10" fill="#ECFDF5"/>
  <text x="440" y="153" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">MonFri · Open</text>
  <rect x="640" y="130" width="200" height="36" rx="10" fill="#FFF1F2"/>
  <text x="660" y="153" fill="#BE123C" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">SatSun · Closed</text>
  <rect x="420" y="185" width="280" height="12" rx="6" fill="#FDE68A"/>
  <rect x="420" y="210" width="180" height="12" rx="6" fill="#E2E8F0"/>
  <text x="860" y="210" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">8:00  18:00</text>
</svg>
