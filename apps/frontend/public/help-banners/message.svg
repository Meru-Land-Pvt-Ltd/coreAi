<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SMS message banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="180" y="50" width="280" height="220" rx="28" fill="#0F172A"/>
  <rect x="200" y="80" width="240" height="150" rx="16" fill="#1E293B"/>
  <rect x="220" y="100" width="160" height="44" rx="12" fill="#F59E0B"/>
  <text x="235" y="127" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Thanks for calling&</text>
  <rect x="250" y="160" width="170" height="44" rx="12" fill="#334155"/>
  <text x="265" y="187" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Can I book Thursday?</text>
  <rect x="560" y="90" width="520" height="140" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="145" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Edit your agent SMS</text>
  <text x="600" y="180" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">Configure ’ save ’ test on the next missed call</text>
</svg>
