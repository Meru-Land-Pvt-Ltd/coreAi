<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="70/30 payment split banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <text x="80" y="70" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">How Triven splits a $100 sale</text>
  <rect x="80" y="110" width="1040" height="64" rx="16" fill="#E2E8F0"/>
  <rect x="80" y="110" width="728" height="64" rx="16" fill="#F59E0B"/>
  <text x="110" y="150" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Architect 70% · $70</text>
  <text x="850" y="150" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Triven 30% · $30</text>
  <rect x="80" y="210" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="105" y="252" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Buyer pays Triven</text>
  <rect x="420" y="210" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
  <text x="445" y="252" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">You withdraw on Payouts</text>
  <rect x="760" y="210" width="360" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="790" y="252" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Same split every renewal</text>
</svg>
