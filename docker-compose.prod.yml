services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: coreai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: coreai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: coreai-backend
    restart: unless-stopped

    env_file:
      - apps/backend/.env.production

    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}

      VAPI_API_KEY: ${VAPI_API_KEY}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Voice keys (ELEVENLABS_API_KEY, CARTESIA_API_KEY) come from
      # apps/backend/.env.production via env_file above. Do NOT list them here:
      # this block overrides env_file, and an unset ${VAR} becomes an empty
      # string instead of being skipped, which would silently blank the key.

      TWILIO_VALIDATE_SIGNATURE: ${TWILIO_VALIDATE_SIGNATURE}
      TWILIO_TEST_MODE: ${TWILIO_TEST_MODE}

      GOOGLE_WORKSPACE_AI_PROCESSING_ENABLED: ${GOOGLE_WORKSPACE_AI_PROCESSING_ENABLED}
      VAPI_WORKSPACE_NO_TRAINING_CONFIRMED: ${VAPI_WORKSPACE_NO_TRAINING_CONFIRMED}
      VAPI_HIPAA_OR_ZDR_CONFIRMED: ${VAPI_HIPAA_OR_ZDR_CONFIRMED}
      OPENAI_NO_TRAINING_CONFIRMED: ${OPENAI_NO_TRAINING_CONFIRMED}
      OPENAI_DATA_SHARING_DISABLED_CONFIRMED: ${OPENAI_DATA_SHARING_DISABLED_CONFIRMED}
      DEEPGRAM_MIP_OPT_OUT_CONFIRMED: ${DEEPGRAM_MIP_OPT_OUT_CONFIRMED}
      ELEVENLABS_TRAINING_OPT_OUT_CONFIRMED: ${ELEVENLABS_TRAINING_OPT_OUT_CONFIRMED}

      # Where architect code runs, and the token that proves the request is ours.
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8790}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    networks:
      - default
      - sandbox_net
      - eyes_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"

  email-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: coreai-email-worker
    restart: unless-stopped
    command: ["node", "dist/email-worker.js"]
    env_file:
      - apps/backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      VAPI_API_KEY: ${VAPI_API_KEY}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:?VAPI_WEBHOOK_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Telegram updates are queued by the webhook and processed here. Without this
  # service every incoming message is stored and queued, and then nothing ever
  # runs the workflow — bots go silent with no error anywhere.
  telegram-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: coreai-telegram-worker
    restart: unless-stopped
    command: ["node", "dist/telegram-worker.js"]
    env_file:
      - apps/backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # The worker exits immediately without Redis — it is the queue transport.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      VAPI_API_KEY: ${VAPI_API_KEY}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:?VAPI_WEBHOOK_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    container_name: coreai-frontend
    restart: unless-stopped
    env_file:
      - apps/frontend/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    depends_on:
      - backend
    networks:
      - default
      - eyes_net
    ports:
      - "127.0.0.1:3000:3000"

  # ---------------------------------------------------------------------------
  # THE BUILDER'S EYES — a browser in a room of its own.
  #
  # The founder's ruling (2026-08-27): the AI Builder must test its own work
  # the way a person does — open it, look at it, fix it — instead of handing
  # an architect an untested screen and calling it done.
  #
  # Why not inside the code sandbox: that room has NO route off the box, on
  # purpose, because it runs an architect's own code. A browser must reach our
  # frontend to render a page, so it needs a road — and a room that runs
  # untrusted code must never have one. Two rooms, two rules.
  #
  # What this room can reach: the frontend, and nothing else. No internet, no
  # backend, no database, no credentials. There is nothing here to steal.
  # ---------------------------------------------------------------------------
  eyes:
    build:
      context: .
      dockerfile: apps/eyes/Dockerfile
    container_name: coreai-eyes
    restart: unless-stopped
    networks:
      - eyes_net
    environment:
      PORT: 8791
      EYES_TOKEN: ${EYES_TOKEN:?EYES_TOKEN is required}
      EYES_ALLOWED_ORIGIN: ${EYES_ALLOWED_ORIGIN:-http://frontend:3000}
    expose:
      - "8791"

  # ---------------------------------------------------------------------------
  # The only place code somebody else wrote is ever executed.
  #
  # Every line below is a wall. Removing any one of them turns this from a
  # sandbox into a way onto the machine that holds every business's credentials.
  # ---------------------------------------------------------------------------
  sandbox:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    container_name: coreai-sandbox
    restart: unless-stopped

    # ONLY the internal network. `internal: true` means Docker creates no
    # gateway for it, so there is no route off this box at all — not a firewall
    # rule someone can misconfigure, an absent road. It joins NOTHING else:
    # a room that runs an architect's own code gets one wall and no doors.
    networks:
      - sandbox_net

    # One variable. There is no platform key here to steal because none is sent.
    environment:
      PORT: 8790
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN is required}

    # Nobody outside this machine, and nothing on the default network, can
    # reach it. Only the backend, over sandbox_net.
    expose:
      - "8790"

    read_only: true
    tmpfs:
      # Somewhere to work that dies with the process, and is too small to be
      # useful for anything but working.
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      # Nothing inside can become root, even if it finds a setuid binary.
      - no-new-privileges:true
    # A fork bomb hits a wall instead of the host.
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # No gateway, no internet, no route anywhere. The backend is on it as well so
  # it can send work; nothing else is.
  sandbox_net:
    internal: true

  # The eyes' room: the browser, the frontend it looks at, and the backend that
  # asks. Internal too — no gateway, so no route to the internet from a browser
  # that renders our own pages.
  eyes_net:
    internal: true

volumes:
  postgres_data:
  redis_data: